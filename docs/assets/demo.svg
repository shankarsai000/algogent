<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#0B1220"/>
  <style>
    .s { opacity:0 }
    #s1 { animation: a1 27s infinite }
    #s2 { animation: a2 27s infinite }
    #s3 { animation: a3 27s infinite }
    #s4 { animation: a4 27s infinite }
    #s5 { animation: a5 27s infinite }
    @keyframes a1 { 0%,14%{opacity:1} 15%,100%{opacity:0} }
    @keyframes a2 { 0%,14%{opacity:0} 15%,32%{opacity:1} 33%,100%{opacity:0} }
    @keyframes a3 { 0%,32%{opacity:0} 33%,62%{opacity:1} 63%,100%{opacity:0} }
    @keyframes a4 { 0%,62%{opacity:0} 63%,80%{opacity:1} 81%,100%{opacity:0} }
    @keyframes a5 { 0%,80%{opacity:0} 81%,100%{opacity:1} }
    text { font-family: system-ui, -apple-system, Segoe UI, sans-serif }
  </style>
  <g id="s1" class="s">
    <text x="480" y="230" text-anchor="middle" fill="#fff" font-size="56" font-weight="700">Algogent</text>
    <text x="480" y="280" text-anchor="middle" fill="#9AA8BC" font-size="18">Open AI skills for ChatGPT · Claude · Gemini · Meta AI</text>
    <text x="480" y="325" text-anchor="middle" fill="#3D8BFD" font-size="22" font-weight="600">No API keys  ·  Free by default</text>
  </g>
  <g id="s2" class="s">
    <text x="480" y="140" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Custom GPTs lock skills in one product</text>
    <text x="480" y="185" text-anchor="middle" fill="#9AA8BC" font-size="18">Switching models means starting over</text>
    <rect x="150" y="250" width="180" height="100" rx="14" fill="#1A2332" stroke="#2A3548"/>
    <rect x="390" y="250" width="180" height="100" rx="14" fill="#1A2332" stroke="#2A3548"/>
    <rect x="630" y="250" width="180" height="100" rx="14" fill="#1A2332" stroke="#2A3548"/>
    <text x="240" y="295" text-anchor="middle" fill="#9AA8BC" font-size="22">X</text>
    <text x="480" y="295" text-anchor="middle" fill="#9AA8BC" font-size="22">X</text>
    <text x="720" y="295" text-anchor="middle" fill="#9AA8BC" font-size="22">X</text>
    <text x="240" y="325" text-anchor="middle" fill="#E7ECF3" font-size="16">ChatGPT</text>
    <text x="480" y="325" text-anchor="middle" fill="#E7ECF3" font-size="16">Claude</text>
    <text x="720" y="325" text-anchor="middle" fill="#E7ECF3" font-size="16">Gemini</text>
  </g>
  <g id="s3" class="s">
    <text x="40" y="50" fill="#fff" font-size="22" font-weight="600">One side panel · many models</text>
    <text x="40" y="80" fill="#9AA8BC" font-size="16">Runs on the chat UI you already use</text>
    <rect x="520" y="40" width="400" height="440" rx="16" fill="#1A2332" stroke="#2A3548"/>
    <text x="548" y="75" fill="#fff" font-size="20" font-weight="600">Algogent</text>
    <text x="548" y="100" fill="#9AA8BC" font-size="13">Skills · ChatGPT · Claude · Gemini</text>
    <rect x="540" y="125" width="360" height="72" rx="10" fill="#161E2C" stroke="#2A3548"/>
    <text x="558" y="155" fill="#E7ECF3" font-size="16">Summarize text</text>
    <rect x="820" y="140" width="46" height="20" rx="6" fill="#143224" stroke="#3DD68C"/>
    <text x="830" y="154" fill="#3DD68C" font-size="11">FREE</text>
    <text x="558" y="180" fill="#9AA8BC" font-size="12">0.000 USDC · all providers</text>
    <rect x="540" y="210" width="360" height="72" rx="10" fill="#161E2C" stroke="#2A3548"/>
    <text x="558" y="240" fill="#E7ECF3" font-size="16">PR review</text>
    <rect x="820" y="225" width="46" height="20" rx="6" fill="#143224" stroke="#3DD68C"/>
    <text x="830" y="239" fill="#3DD68C" font-size="11">FREE</text>
    <text x="558" y="265" fill="#9AA8BC" font-size="12">0.000 USDC · all providers</text>
    <rect x="540" y="295" width="360" height="72" rx="10" fill="#161E2C" stroke="#2A3548"/>
    <text x="558" y="325" fill="#E7ECF3" font-size="16">Meeting notes</text>
    <rect x="820" y="310" width="46" height="20" rx="6" fill="#143224" stroke="#3DD68C"/>
    <text x="830" y="324" fill="#3DD68C" font-size="11">FREE</text>
    <text x="558" y="350" fill="#9AA8BC" font-size="12">0.000 USDC · all providers</text>
    <rect x="540" y="420" width="360" height="36" rx="8" fill="#3D8BFD"/>
    <text x="720" y="443" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">Run (free)</text>
  </g>
  <g id="s4" class="s">
    <text x="480" y="210" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Runs in the chat you already use</text>
    <text x="480" y="270" text-anchor="middle" fill="#3DD68C" font-size="22" font-weight="600">Done · free skill · no charge</text>
    <text x="480" y="320" text-anchor="middle" fill="#9AA8BC" font-size="18">Failed runs are never charged</text>
  </g>
  <g id="s5" class="s">
    <text x="480" y="180" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Open Skill Format</text>
    <text x="480" y="230" text-anchor="middle" fill="#3D8BFD" font-size="18">manifest.json  +  SKILL.md</text>
    <text x="480" y="310" text-anchor="middle" fill="#fff" font-size="22" font-weight="600">github.com/shankarsai000/algogent</text>
    <text x="480" y="360" text-anchor="middle" fill="#9AA8BC" font-size="16">MIT  ·  Portable  ·  Pay only on success</text>
  </g>
</svg>
